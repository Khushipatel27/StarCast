[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starcast"
version = "1.0.0"
description = "Hybrid star-rating prediction and recommendations for local businesses, served with FastAPI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Khushi Patel" }]
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
starcast-train = "starcast.training.pipeline:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
